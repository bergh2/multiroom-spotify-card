<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>multiroom-spotify-card-ma dev preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background: var(--page, #08080a);
        font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, sans-serif;
        color: #f5f5f7;
        transition: background 0.35s ease;
      }
      body.light {
        --page: #f2f2f5;
        color: #111114;
      }
      #wrap {
        display: flex;
        gap: 24px;
        padding: 32px 24px;
        align-items: flex-start;
        justify-content: center;
        flex-wrap: wrap;
      }
      #stage {
        width: 340px;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 18px;
        font-size: 12px;
      }
      #controls button,
      #controls select {
        font: inherit;
        padding: 5px 10px;
        border-radius: 999px;
        border: 0.5px solid rgba(128, 128, 128, 0.4);
        background: rgba(128, 128, 128, 0.12);
        color: inherit;
        cursor: pointer;
      }
      #log {
        width: 380px;
        max-height: 80vh;
        overflow: auto;
        font: 11px/1.5 ui-monospace, Menlo, monospace;
        color: inherit;
        opacity: 0.8;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div>
        <div id="controls">
          <button id="theme">Theme: dark</button>
          <button id="layout">Layout: tiles</button>
          <button id="playing">Toggle playing</button>
          <button id="kill">Playlists: error</button>
          <button id="clear">Clear log</button>
        </div>
        <div id="stage"></div>
      </div>
      <pre id="log"></pre>
    </div>
    <script type="module" src="/dev/main.ts"></script>
  </body>
</html>
